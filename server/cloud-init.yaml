#cloud-config
# Hetzner Cloud "user data" for a fresh Ubuntu 24.04 server. Paste this into the
# Cloud Console (Add Server > Cloud config) after replacing SSH-PUBLIC-KEY-HERE.
# On first boot it creates a sudo user, hardens SSH, opens the firewall, and
# installs Docker + Caddy. Then SSH in and run the deploy steps in DEPLOY.md.

users:
  - name: brent
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - SSH-PUBLIC-KEY-HERE

disable_root: true
ssh_pwauth: false

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - ufw
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https

runcmd:
  # Firewall: SSH + HTTP/HTTPS only.
  - ufw allow OpenSSH
  - ufw allow 80
  - ufw allow 443
  - ufw --force enable
  # Docker engine + compose plugin.
  - curl -fsSL https://get.docker.com | sh
  # Caddy (reverse proxy, automatic HTTPS).
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' > /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update
  - apt-get install -y caddy
